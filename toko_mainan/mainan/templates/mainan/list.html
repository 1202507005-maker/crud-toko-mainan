<!DOCTYPE html>
<html>
<head>
    <title>Data Mainan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 class="mb-3">📦 Data Mainan</h2>

    <a href="{% url 'mainan_create' %}" class="btn btn-primary mb-3">
        + Tambah Mainan
    </a>

   <table class="table table-bordered table-hover">
    <thead class="table-info">

    <tr>
        <th>ID</th>
        <th>Nama</th>
        <th>Harga</th>
        <th>Stok</th>
        <th>Usia Rekomendasi</th>
        <th>Deskripsi</th>
        <th width="180">Aksi</th>
    </tr>
</thead>

<tbody>
{% for m in data %}
<tr>
    <td>{{ m.id }}</td>
    <td>{{ m.nama_mainan }}</td>
    <td>Rp {{ m.harga }}</td>
    <td>{{ m.stok }}</td>
    <td>{{ m.usia_rekomendasi }}</td>
    <td>{{ m.deskripsi|truncatechars:30 }}</td>
    <td>
        <a href="{% url 'mainan_update' m.id %}" class="btn btn-warning btn-sm">
            Edit
        </a>
        <a href="{% url 'mainan_delete' m.id %}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Yakin ingin menghapus?')">
           Hapus
        </a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="6" class="text-center">Data belum ada</td>
</tr>
{% endfor %}
</tbody>

    </table>

</div>

</body>
</html>
